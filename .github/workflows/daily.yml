name: Daily Job Hunter Run

# Cron is always UTC. 05:00 UTC = 08:00 Israel time during IDT (summer,
# UTC+3, roughly Mar-Oct) and 07:00 during IST (winter, UTC+2) — GitHub
# Actions cron doesn't support timezones, so this drifts by an hour twice
# a year around the clock-change dates. Adjust the minute/hour below if
# you want to re-tune it after a DST switch.
"on":
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit updated state/ back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config.py from secret
        # config.py is git-ignored (holds profile info alongside settings)
        # so it doesn't exist on a fresh checkout — reconstruct it from a
        # repo secret instead. The secret is base64 of the literal file
        # content (does NOT itself contain API keys/tokens — those are
        # loaded separately via os.getenv() below, same as local .env).
        # Base64 deliberately avoids embedding real newlines in the
        # secret's stored value — a plain multi-line paste of config.py
        # was observed collapsing to a single line somewhere in the
        # browser-paste -> GitHub-secret-storage -> Actions-substitution
        # chain; a single-line base64 blob has no newlines to lose.
        #
        # Reads the secret via env: (assigns it to a shell variable)
        # rather than interpolating ${{ }} directly into the script body
        # — this is GitHub's own recommended pattern for using a secret
        # inside a run: step, and prints its length (safe — reveals
        # nothing about content, and isn't the literal secret so Actions'
        # log-masking has nothing to redact) so a genuinely empty/unset
        # secret fails immediately with a clear reason instead of
        # silently producing an empty config.py.
        env:
          CONFIG_PY_B64: ${{ secrets.CONFIG_PY_B64 }}
        run: |
          echo "CONFIG_PY_B64 secret length: ${#CONFIG_PY_B64} chars"
          if [ -z "$CONFIG_PY_B64" ]; then
            echo "::error::CONFIG_PY_B64 secret is empty or not set. Add it under repo Settings -> Secrets and variables -> Actions -> 'Secrets' tab -> New repository secret (NOT under Environments), name exactly CONFIG_PY_B64."
            exit 1
          fi
          echo "$CONFIG_PY_B64" | base64 -d > config.py

      - name: Verify config.py is complete
        # Fails fast with a clear, actionable message instead of letting
        # main.py hit a confusing AttributeError deep in its own traceback
        # — that's exactly what a truncated/stale CONFIG_PY secret paste
        # looks like. Also prints the reconstructed line count so a
        # truncation is visible at a glance without waiting for a full
        # pipeline run to fail.
        run: |
          lines=$(wc -l < config.py)
          echo "config.py reconstructed: $lines lines"
          if ! grep -q "^def check_keys" config.py; then
            echo "::error::config.py is missing check_keys() — the CONFIG_PY_B64 secret looks truncated or stale. Re-generate it (see .github/workflows/daily.yml comments) and update the CONFIG_PY_B64 secret (repo Settings -> Secrets and variables -> Actions), then re-run."
            exit 1
          fi
          python -c "import ast; ast.parse(open('config.py', encoding='utf-8').read())" || { echo "::error::config.py is not valid Python — the CONFIG_PY secret content is corrupted."; exit 1; }
          echo "config.py looks complete."

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: python main.py --telegram

      - name: Commit updated state
        # state/ holds seen_jobs.json / api_usage.json / outreach_log.jsonl
        # — this run's dedup + API-budget progress needs to survive to
        # tomorrow's run, which starts from a completely fresh checkout.
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update state [skip ci]"
          git push
